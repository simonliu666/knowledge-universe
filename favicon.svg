<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1750"/>
      <stop offset="0.55" stop-color="#1b1240"/>
      <stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="bookL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bookR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#4c2a8f" stroke-opacity="0.6" stroke-width="1"/>

  <!-- 星点 -->
  <g fill="#cdd6ff">
    <circle cx="10" cy="11" r="1.1" opacity="0.9"/>
    <circle cx="53" cy="13" r="0.9" opacity="0.8"/>
    <circle cx="55" cy="44" r="1.2" opacity="0.85"/>
    <circle cx="12" cy="50" r="0.8" opacity="0.75"/>
    <circle cx="45" cy="8" r="0.8" opacity="0.7"/>
  </g>

  <!-- 打开的书 -->
  <g filter="url(#glow)">
    <path d="M32 47 C 29 45, 25.5 44.2, 22 44.6 L 22 26 C 25.5 25.6, 29 26.4, 32 28.4 Z"
          fill="url(#bookL)" stroke="#c4b5fd" stroke-width="1"/>
    <path d="M32 47 C 35 45, 38.5 44.2, 42 44.6 L 42 26 C 38.5 25.6, 35 26.4, 32 28.4 Z"
          fill="url(#bookR)" stroke="#93c5fd" stroke-width="1"/>
  </g>

  <!-- 中央发光点 -->
  <circle cx="32" cy="36" r="2.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="32" cy="36" r="1.3" fill="#e0f2fe"/>

  <text x="32" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff" letter-spacing="0.5" opacity="0.85">宇宙</text>
</svg>